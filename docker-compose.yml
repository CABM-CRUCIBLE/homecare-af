services:
  # ─── HomeCare Agent Pipeline ───────────────────────────────────────────────
  homecare-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homecare-agent
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-anthropic/claude-sonnet-4}
      - MODEL_ARCHITECTURE=${MODEL_ARCHITECTURE:-anthropic/claude-sonnet-4}
      - MODEL_CODE=${MODEL_CODE:-deepseek/deepseek-coder}
      - MODEL_REVIEW=${MODEL_REVIEW:-anthropic/claude-sonnet-4}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - REPO_PATH=/workspace
      - REPO_URL=${REPO_URL:-}
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-true}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-homecare-local}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-homecare-local}
      - LANGFUSE_HOST=http://langfuse-server:3000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Bind Gradio to all interfaces so Docker port mapping (127.0.0.1:7860->7860) works
      - GRADIO_SERVER_NAME=0.0.0.0
    volumes:
      # Mount target repository into container workspace
      - ${REPO_PATH:-${HOST_REPO_PATH:-.}}:/workspace
    depends_on:
      - langfuse-server
    restart: unless-stopped

  # ─── Local Langfuse UI & Tracing Server (Port 13000) ──────────────────────
  langfuse-server:
    image: langfuse/langfuse:2
    container_name: langfuse-server
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      - DATABASE_URL=postgresql://${LANGFUSE_DB_USER:-postgres}:${LANGFUSE_DB_PASSWORD:-postgres}@langfuse-db:5432/${LANGFUSE_DB_NAME:-langfuse}
      - NEXTAUTH_URL=http://localhost:13000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-changeme-nextauth-secret-32-chars-min}
      - SALT=${SALT:-changeme-salt-min-16-chars}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TELEMETRY_ENABLED=false
      # Headless Auto-Provisioning (User Account, Org, Project, API Keys)
      - LANGFUSE_INIT_ORG_ID=${LANGFUSE_INIT_ORG_ID:-homecare-org}
      - LANGFUSE_INIT_ORG_NAME=${LANGFUSE_INIT_ORG_NAME:-HomeCare}
      - LANGFUSE_INIT_PROJECT_ID=${LANGFUSE_INIT_PROJECT_ID:-homecare}
      - LANGFUSE_INIT_PROJECT_NAME=${LANGFUSE_INIT_PROJECT_NAME:-HomeCare}
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-homecare-local}
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-homecare-local}
      - LANGFUSE_INIT_USER_EMAIL=${LANGFUSE_INIT_USER_EMAIL:-admin@homecare.local}
      - LANGFUSE_INIT_USER_NAME=${LANGFUSE_INIT_USER_NAME:-HomeCare Admin}
      - LANGFUSE_INIT_USER_PASSWORD=${LANGFUSE_INIT_USER_PASSWORD}
    restart: unless-stopped

  # ─── Local Postgres Database for Langfuse ──────────────────────────────────
  langfuse-db:
    image: postgres:16-alpine
    container_name: langfuse-db
    environment:
      - POSTGRES_USER=${LANGFUSE_DB_USER:-postgres}
      - POSTGRES_PASSWORD=${LANGFUSE_DB_PASSWORD:-postgres}
      - POSTGRES_DB=${LANGFUSE_DB_NAME:-langfuse}
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${LANGFUSE_DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_DB_USER:-postgres} -d ${LANGFUSE_DB_NAME:-langfuse}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  langfuse_db_data:
