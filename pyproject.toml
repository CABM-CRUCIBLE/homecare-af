[project]
name = "homecare-agent"
version = "0.1.0"
description = "Automated agentic code generation framework for enterprise healthcare platforms using LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HomeCare Team" }]
dependencies = [
    # === LangGraph & LangChain ===
    "langgraph>=0.4",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    # === Observability ===
    "langfuse>=3.0",
    # === GitHub & Git ===
    "PyGithub>=2.0",
    "GitPython>=3.1",
    # === Data Models & Validation ===
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # === CLI & UI ===
    "rich>=13.0",
    "typer>=0.12",
    "gradio>=5.0",
    # === HTTP & Async ===
    "httpx>=0.27",
    "aiofiles>=24.0",
    # === Image Processing ===
    "Pillow>=10.0",
    # === Configuration ===
    "python-dotenv>=1.0",
    # === File Handling ===
    "anyio>=4.0",
    "pathspec>=0.12",
    # === Templating ===
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
homecare-agent = "homecare_agent.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homecare_agent"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
